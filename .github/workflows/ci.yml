name: CLI validation

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  validate-linux:
    name: Validate on Linux and cross-build Windows
    # The last label routes this job only to the CodeBuild runner started for it.
    runs-on:
      - codebuild-extrabrain-ci-${{ github.run_id }}-${{ github.run_attempt }}
      - cli-ci-linux
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Cross-build and check Windows executables
        run: bash scripts/build-windows.sh

  validate-macos:
    name: Validate macOS in a Tart VM
    # Runs for pushes only, so pull requests from forks never reach the shared Mac mini.
    if: github.event_name == 'push'
    runs-on: [self-hosted, macOS, ARM64, macmini, macos-vm]
    permissions:
      contents: read
      packages: read
    env:
      TART_REGISTRY_HOSTNAME: ghcr.io
      TART_REGISTRY_USERNAME: ${{ github.actor }}
      TART_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Start disposable macOS VM
        run: bash scripts/tart-job.sh start
      - name: Validate, build, and test both macOS executables
        run: bash scripts/tart-job.sh run 'bash scripts/ci-macos.sh ci'
      - name: Delete macOS VM
        if: always()
        run: bash scripts/tart-job.sh stop
