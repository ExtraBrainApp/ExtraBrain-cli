name: CLI validation

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: '["self-hosted","macOS","ARM64"]'
          - runner: '["self-hosted","macOS","X64"]'
    runs-on: ${{ fromJSON(matrix.runner) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:sea
      - name: Smoke test macOS executable
        shell: bash
        run: |
          set -euo pipefail
          test "$(dist/extrabrain --version)" = "$(node -p 'require("./package.json").version')"
          set +e
          result=$(dist/extrabrain --json capabilities)
          code=$?
          set -e
          test "$code" = 3
          echo "$result" | jq -e '.code == 3'
