name: Standalone CLI release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version level to increase
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: cli-release
  cancel-in-progress: false

jobs:
  prepare:
    # Each CodeBuild job has a label of its own, so a runner started for one job cannot take another.
    runs-on:
      - codebuild-extrabrain-ci-${{ github.run_id }}-${{ github.run_attempt }}
      - cli-release-prepare
    outputs:
      base_sha: ${{ steps.version.outputs.base_sha }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: master
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
      - name: Calculate release version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/master
          npm version "$BUMP" --no-git-tag-version --ignore-scripts
          version=$(node -p 'require("./package.json").version')
          tag="v$version"
          if git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null; then
            echo "Release tag $tag already exists" >&2
            exit 1
          fi
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build-macos:
    name: Build darwin-arm64 and darwin-x64
    needs: prepare
    # Builds in a disposable Tart VM; the x64 executable is cross-built from the x64 Node release.
    runs-on: [self-hosted, macOS, ARM64, macmini, macos-vm]
    permissions:
      contents: read
      packages: read
    env:
      TART_REGISTRY_HOSTNAME: ghcr.io
      TART_REGISTRY_USERNAME: ${{ github.actor }}
      TART_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
      - name: Start disposable macOS VM
        run: bash scripts/tart-job.sh start
      - name: Validate, build, verify, and archive macOS executables
        run: bash scripts/tart-job.sh run "RELEASE_VERSION=$RELEASE_VERSION RELEASE_TAG=$RELEASE_TAG bash scripts/ci-macos.sh release"
      - name: Copy archives from the VM
        run: bash scripts/tart-job.sh fetch "extrabrain-$RELEASE_TAG-darwin-arm64.tar.gz" "extrabrain-$RELEASE_TAG-darwin-x64.tar.gz"
      - name: Delete macOS VM
        if: always()
        run: bash scripts/tart-job.sh stop
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: darwin
          path: extrabrain-${{ needs.prepare.outputs.tag }}-darwin-*.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build win32-x64 and win32-arm64
    needs: prepare
    runs-on:
      - codebuild-extrabrain-ci-${{ github.run_id }}-${{ github.run_attempt }}
      - cli-release-windows
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
      - name: Set release version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          npm version "$RELEASE_VERSION" --no-git-tag-version --ignore-scripts
          node scripts/check-release-version.mjs
      - name: Install dependencies
        run: npm ci
      - name: Validate CLI
        run: npm run check
      - name: Cross-build, check, and archive Windows executables
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: bash scripts/build-windows.sh
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: win32
          path: extrabrain-${{ needs.prepare.outputs.tag }}-win32-*.zip
          if-no-files-found: error

  publish:
    needs: [prepare, build-macos, build-windows]
    runs-on:
      - codebuild-extrabrain-ci-${{ github.run_id }}-${{ github.run_attempt }}
      - cli-release-publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
      - uses: actions/download-artifact@v8.0.1
        with:
          path: release-assets
          merge-multiple: true
      - name: Commit and tag release version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          npm version "$RELEASE_VERSION" --no-git-tag-version --ignore-scripts
          node scripts/check-release-version.mjs
          git config --local user.name 'ExtraBrain Developer'
          git config --local user.email 'developer@extrabrain.app'
          git config --local user.useConfigOnly true
          test "$(git config --local --get user.name)" = 'ExtraBrain Developer'
          test "$(git config --local --get user.email)" = 'developer@extrabrain.app'
          git add package.json package-lock.json
          git commit -m "Release $RELEASE_TAG"
          git tag "$RELEASE_TAG"
          git push --atomic origin HEAD:master "refs/tags/$RELEASE_TAG"
      - name: Write checksum manifest and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum extrabrain-* > SHA256SUMS
          gh release create "$RELEASE_TAG" extrabrain-* SHA256SUMS --title "$RELEASE_TAG" --notes "Unsigned CLI release for macOS and Windows. The macOS executables are not Developer ID signed or notarized, and the Windows executables are not Authenticode signed." --verify-tag
