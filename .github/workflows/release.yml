name: Standalone CLI release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version level to increase
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: cli-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: [self-hosted, macOS, ARM64]
    outputs:
      base_sha: ${{ steps.version.outputs.base_sha }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - name: Check Apple signing configuration
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_TEAM_ID APPLE_ID APPLE_APP_SPECIFIC_PASSWORD; do
            if test -z "${!name}"; then
              echo "Missing GitHub Actions secret: $name" >&2
              exit 1
            fi
          done
      - name: Calculate release version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          npm version "$BUMP" --no-git-tag-version --ignore-scripts
          version=$(node -p 'require("./package.json").version')
          tag="v$version"
          if git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null; then
            echo "Release tag $tag already exists" >&2
            exit 1
          fi
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: '["self-hosted","macOS","ARM64"]'
            target: darwin-arm64
          - runner: '["self-hosted","macOS","X64"]'
            target: darwin-x64
    runs-on: ${{ fromJSON(matrix.runner) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - name: Set release version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          npm version "$RELEASE_VERSION" --no-git-tag-version --ignore-scripts
          node scripts/check-release-version.mjs
      - name: Install dependencies
        run: npm ci
      - name: Validate CLI
        run: npm run check
      - name: Build executable
        run: npm run build:sea
      - name: Sign and notarize macOS executable
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          certificate="$RUNNER_TEMP/cli-signing.p12"
          keychain="$RUNNER_TEMP/cli-signing.keychain-db"
          trap 'security delete-keychain "$keychain" >/dev/null 2>&1 || true; rm -f "$certificate"' EXIT
          test -n "$APPLE_CERTIFICATE_BASE64"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$APPLE_TEAM_ID"
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 -D -o "$certificate"
          security create-keychain -p "$APPLE_CERTIFICATE_PASSWORD" "$keychain"
          security unlock-keychain -p "$APPLE_CERTIFICATE_PASSWORD" "$keychain"
          security import "$certificate" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          identity=$(security find-identity -v -p codesigning "$keychain" | grep "Developer ID Application:.*($APPLE_TEAM_ID)" | head -1 | awk '{ print $2 }')
          test -n "$identity"
          codesign --force --options runtime --timestamp --sign "$identity" --keychain "$keychain" dist/extrabrain
          codesign --verify --strict --verbose=2 dist/extrabrain
          ditto -c -k --keepParent dist/extrabrain "$RUNNER_TEMP/extrabrain-notary.zip"
          xcrun notarytool submit "$RUNNER_TEMP/extrabrain-notary.zip" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait --output-format json > "$RUNNER_TEMP/notary-result.json"
          jq -e '.status == "Accepted"' "$RUNNER_TEMP/notary-result.json"
      - name: Verify and archive macOS executable
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          test "$(dist/extrabrain --version)" = "${RELEASE_TAG#v}"
          set +e
          result=$(dist/extrabrain --json capabilities)
          code=$?
          set -e
          test "$code" = 3
          echo "$result" | jq -e '.code == 3 and .message == "ExtraBrain is not running"'
          tar -czf "extrabrain-$RELEASE_TAG-$TARGET.tar.gz" -C dist extrabrain
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: extrabrain-${{ needs.prepare.outputs.tag }}-${{ matrix.target }}.*
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: [self-hosted, macOS, ARM64]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Commit and tag release version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          npm version "$RELEASE_VERSION" --no-git-tag-version --ignore-scripts
          node scripts/check-release-version.mjs
          git config --local user.name 'ExtraBrain Developer'
          git config --local user.email 'developer@extrabrain.app'
          git config --local user.useConfigOnly true
          test "$(git config --local --get user.name)" = 'ExtraBrain Developer'
          test "$(git config --local --get user.email)" = 'developer@extrabrain.app'
          git add package.json package-lock.json
          git commit -m "Release $RELEASE_TAG"
          git tag "$RELEASE_TAG"
          git push --atomic origin HEAD:main "refs/tags/$RELEASE_TAG"
      - name: Write checksum manifest and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          cd release-assets
          shasum -a 256 extrabrain-* > SHA256SUMS
          gh release create "$RELEASE_TAG" extrabrain-* SHA256SUMS --title "$RELEASE_TAG" --generate-notes --verify-tag
