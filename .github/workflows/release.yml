name: Standalone CLI release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version level to increase
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: cli-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      base_sha: ${{ steps.version.outputs.base_sha }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: master
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
      - name: Calculate release version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/master
          npm version "$BUMP" --no-git-tag-version --ignore-scripts
          version=$(node -p 'require("./package.json").version')
          tag="v$version"
          if git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null; then
            echo "Release tag $tag already exists" >&2
            exit 1
          fi
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
      - name: Set release version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          npm version "$RELEASE_VERSION" --no-git-tag-version --ignore-scripts
          node scripts/check-release-version.mjs
      - name: Install dependencies
        run: npm ci
      - name: Validate CLI
        run: npm run check
      - name: Build executable
        run: npm run build:sea
      - name: Verify and archive macOS executable
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          test "$(dist/extrabrain --version)" = "${RELEASE_TAG#v}"
          set +e
          result=$(dist/extrabrain --json capabilities)
          code=$?
          set -e
          test "$code" = 3
          echo "$result" | jq -e '.code == 3 and .message == "ExtraBrain is not running"'
          tar -czf "extrabrain-$RELEASE_TAG-$TARGET.tar.gz" -C dist extrabrain
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.target }}
          path: extrabrain-${{ needs.prepare.outputs.tag }}-${{ matrix.target }}.*
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
      - uses: actions/download-artifact@v8.0.1
        with:
          path: release-assets
          merge-multiple: true
      - name: Commit and tag release version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          npm version "$RELEASE_VERSION" --no-git-tag-version --ignore-scripts
          node scripts/check-release-version.mjs
          git config --local user.name 'ExtraBrain Developer'
          git config --local user.email 'developer@extrabrain.app'
          git config --local user.useConfigOnly true
          test "$(git config --local --get user.name)" = 'ExtraBrain Developer'
          test "$(git config --local --get user.email)" = 'developer@extrabrain.app'
          git add package.json package-lock.json
          git commit -m "Release $RELEASE_TAG"
          git tag "$RELEASE_TAG"
          git push --atomic origin HEAD:master "refs/tags/$RELEASE_TAG"
      - name: Write checksum manifest and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum extrabrain-* > SHA256SUMS
          gh release create "$RELEASE_TAG" extrabrain-* SHA256SUMS --title "$RELEASE_TAG" --notes "Unsigned macOS CLI release. This executable is not Developer ID signed or notarized." --verify-tag
